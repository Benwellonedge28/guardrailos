version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guardrail
      POSTGRES_PASSWORD: guardrail
      POSTGRES_DB: guardrail
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardrail"]
      interval: 5s
      timeout: 3s
      retries: 5

  lobster-trap:
    image: veea/lobster-trap:latest
    ports:
      - "8080:8080"
    restart: unless-stopped

  api:
    build: ./guardrailos-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://guardrail:guardrail@db:5432/guardrail
      LOBSTER_TRAP_URL: http://lobster-trap:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      lobster-trap:
        condition: service_started
    volumes:
      - ./guardrailos-api:/app

  frontend:
    build: ./guardrailos-ui
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./guardrailos-ui:/app
      - /app/node_modules

volumes:
  pgdata:
